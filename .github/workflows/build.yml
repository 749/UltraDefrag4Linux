name: Build and test

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:

jobs:
  linux:
    name: Linux build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            lsb-release \
            libncurses-dev \
            ntfs-3g-dev

      - name: Bootstrap
        run: ./autogen.sh

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      - name: Test
        run: make check

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: udefrag-linux
          path: udefrag
          if-no-files-found: error
